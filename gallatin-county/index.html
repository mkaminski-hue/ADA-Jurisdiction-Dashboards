<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Gallatin County ADA Polling Place Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f6f4;--card:#fcfcfb;--ink:#161615;--ink2:#52514e;--muted:#74736c;--line:#dcdbd5;--soft:#efeee9;
--ok:#2a78d6;--okbg:#e7f0fb;--bad:#c4501f;--badfill:#eb6834;--badbg:#fdeee6;--na:#8c8b84;--nabg:#efeee9;--head:#0f2a47;--focus:#2a78d6}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#9a998f;--line:#34342f;--soft:#232321;
--ok:#6aa6ee;--okbg:#17263a;--bad:#f08a5d;--badfill:#d95926;--badbg:#3a2117;--na:#9a998f;--nabg:#262624;--head:#9cc4f2;--focus:#6aa6ee;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
 padding:24px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1080px;margin:0 auto}
a{color:var(--ok)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
h1{font-weight:600;font-size:34px;line-height:1.15;color:var(--head);margin:0 0 4px;text-wrap:balance}
h2{font-weight:600;font-size:22px;line-height:1.25;color:var(--head);margin:0;text-wrap:balance}
h3{font-weight:600;font-size:16px;margin:0}
.meta{color:var(--ink2);margin:0}
.back{display:inline-block;font-size:14px;margin:0 0 14px;text-decoration:none}.back:hover{text-decoration:underline}
header.top{margin-bottom:18px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px;
 display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 360px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
select,button{font:inherit;color:inherit}
select{width:100%;padding:9px 36px 9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
 background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;font-size:15px}
select:focus-visible,button:focus-visible,summary:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn[disabled]{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:9px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--head);color:var(--card);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin-bottom:18px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .k{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:13px;color:var(--ink2)}
/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px 2px 8px;font-size:13px;font-weight:600;white-space:nowrap}
.pill .ic{font-size:12px;line-height:1}
.pill.pass{background:var(--okbg);color:var(--ok)}
.pill.fail{background:var(--badbg);color:var(--bad)}
.pill.na,.pill.skip{background:var(--nabg);color:var(--ink2);font-weight:500}
.pill.big{font-size:15px;padding:5px 14px 5px 11px}
/* overview matrix */
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%}
.matrix{font-size:14px;font-variant-numeric:tabular-nums}
.matrix th,.matrix td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.matrix thead th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;position:sticky;top:0;background:var(--card)}
.matrix th.c,.matrix td.c{text-align:center;width:44px;padding-left:2px;padding-right:2px}
.matrix tbody tr{cursor:pointer}
.matrix tbody tr:hover{background:var(--soft)}
.matrix .loc{color:var(--ink2);font-size:13px;display:block}
.cell{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;border-radius:5px;font-size:13px;font-weight:600}
.cell.pass{color:var(--ok)}
.cell.fail{background:var(--badbg);color:var(--bad)}
.cell.na{color:var(--na);font-weight:400}
.keyrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2);margin:10px 0 0}
.keyrow span{display:inline-flex;align-items:center;gap:6px}
/* common issues bars */
.bars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bars li{display:grid;grid-template-columns:52px 1fr 56px;gap:4px 12px;align-items:center}
.bars .code{font-weight:600;font-size:13px}
.bars .q{font-size:13.5px;color:var(--ink2);grid-column:2/4}
.bars .track{grid-column:2;height:10px;background:var(--soft);border-radius:0 4px 4px 0}
.bars .fill{height:10px;background:var(--badfill);border-radius:0 4px 4px 0;min-width:3px}
.bars .n{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
/* site view */
.sitehead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 20px;align-items:flex-start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 24px;margin:16px 0 0}
.facts div{min-width:0}
.facts dt{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:14px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:18px}
.chip{border:1px solid var(--line);border-left-width:4px;border-radius:6px;padding:8px 10px;background:var(--card);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.chip:hover{background:var(--soft)}
.chip .t{font-size:13px;font-weight:600}
.chip .s{font-size:12.5px;color:var(--ink2)}
.chip.pass{border-left-color:var(--ok)}.chip.fail{border-left-color:var(--badfill)}.chip.na{border-left-color:var(--line)}
.chip.fail .s{color:var(--bad);font-weight:600}
.issue{display:grid;grid-template-columns:56px 1fr;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:0}
.code-badge{font-weight:600;font-size:13px;background:var(--badbg);color:var(--bad);border-radius:5px;padding:2px 0;text-align:center;height:max-content}
.issue .q{font-weight:500}
.issue .inst{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.note{margin-top:4px;padding:8px 12px;background:var(--soft);border-radius:6px;font-size:14px;overflow-wrap:anywhere}
.note b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block}
.note.empty{color:var(--muted);font-style:italic;background:none;padding:0}
.secgroup+.secgroup{margin-top:18px}
.secgroup>h3{font-size:14px;color:var(--ink2);margin-bottom:2px}
.improve{border-left:4px solid var(--head);padding:4px 0 4px 14px;margin:8px 0 0;white-space:pre-wrap}
details.sec{scroll-margin-top:96px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:10px}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3::before{content:"\25B8";display:inline-block;width:1.1em;color:var(--muted);transition:transform .15s}
details.sec[open]>summary h3::before{transform:rotate(90deg)}
.secbody{padding:0 18px 16px}
.inst-h{font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px;letter-spacing:.03em;text-transform:uppercase}
.descs{font-size:14px;color:var(--ink2);margin:0 0 8px}
.descs span{color:var(--muted)}
.qtable{font-size:14px}
.qtable th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.qtable td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.qtable td.code{font-weight:600;width:52px;white-space:nowrap}
.qtable td.ans{width:150px}
.qtable td.nt{width:34%;color:var(--ink2);overflow-wrap:anywhere}
.qtable tr.fail td.code{color:var(--bad)}
.qtable .why{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.muted{color:var(--muted)}
.hidden{display:none!important}
.empty-state{color:var(--ink2);margin:0}
footer{font-size:12.5px;color:var(--muted);margin-top:28px}
@media (max-width:700px){h1{font-size:27px}.controls{position:static}.card{padding:16px}.qtable thead{display:none}
 .qtable tr{display:grid;grid-template-columns:52px 1fr;padding:8px 0;border-bottom:1px solid var(--line)}
 .qtable td{border:0;padding:2px 6px}.qtable td.ans,.qtable td.nt{grid-column:2;width:auto}
 .issue{grid-template-columns:48px 1fr}}
@media print{body{background:#fff;padding:0;font-size:12px}.controls,.noprint{display:none!important}
 .card,details.sec{break-inside:avoid-page;border-color:#ccc}details.sec>summary h3::before{content:none}
 .matrix thead th{position:static}}
</style>
</head>

"q":"Is the threshold of each door no higher than 1⁄2”?","ans":"Yes","note":"","st":"pass","why":""},{"code":"F12","q":"On the pull side of each door, is there at least 18” of clearance provided to the side of the latch?","ans":"Yes","note":"","st":"pass","why":""},{"code":"F13","q":"Is the area in front of each door level, with slopes no greater than 1:48 in all directions?","ans":"Yes","note":"","st":"pass","why":""}]}],"stray":[]},{"key":"G","label":"Voting Area","status":"pass","fails":0,"na":"","instances":[{"label":"","desc":[],"items":[{"code":"G1","q":"Are floor surfaces stable, firm, and slip resistant?","ans":"Yes","note":"","st":"pass","why":""},{"code":"G2","q":"Is the route free of wall-mounted objects that protrude more than 4” into the path of travel and are between 27” and 80” high?","ans":"Yes","note":"","st":"pass","why":""},{"code":"G3","q":"Is the route free of post-mounted objects that protrude more than 12” into the path of travel and are between 27” and 80” high?","ans":"Yes","note":"","st":"pass","why":""},{"code":"G4","q":"Are objects that hang over the route 80” or higher, including the underside of the stairs?","ans":"Yes","note":"","st":"pass","why":""},{"code":"G5","q":"Is there enough room to provide a route at least 36” wide along the path of travel?","ans":"Yes","note":"","st":"pass","why":""},{"code":"G6","q":"Is there enough room to provide a turning space in front of at least one voting station, such as a circle that is at least 60” in diameter?","ans":"Yes","note":"","st":"pass","why":""},{"code":"G7","q":"Is there enough room to provide a turning space in front of at least one accessible voting machine, such as a circle that is at least 60” in diameter?","ans":"Yes","note":"","st":"pass","why":""}]}],"stray":[]},{"key":"H","label":"Lift","status":"na","fails":0,"na":"No lift reported","instances":[],"stray":[]},{"key":"I","label":"Elevator","status":"na","fails":0,"na":"No elevator reported","instances":[],"stray":[]}],"fails":6, <script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const SEC=D.sections; const sites=D.sites; const byId={}; sites.forEach(s=>byId[s.id]=s);
let mode='fail';
try{const m=localStorage.getItem('ada-dash-mode');if(m==='all'||m==='fail')mode=m;}catch(e){}

function el(tag,attrs,...kids){const n=document.createElement(tag);
 if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
  if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v===true?'':v);}
 for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;n.appendChild(typeof k==='string'||typeof k==='number'?document.createTextNode(String(k)):k);}
 return n;}
const ICON={pass:'✓',fail:'!',na:'–',skip:'–'};
function pill(st,text,big){return el('span',{class:'pill '+st+(big?' big':'')},el('span',{class:'ic','aria-hidden':'true',text:ICON[st]}),text);}
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const secStatusText=s=>s.status==='pass'?'Compliant':s.status==='fail'?plural(s.fails,'item')+' to remediate':'Not applicable';

document.getElementById('title').textContent=D.title;
const nPass=sites.filter(s=>s.status==='pass').length;
document.getElementById('meta').textContent=plural(sites.length,'polling place')+' surveyed'+(D.dates?' '+D.dates:'')+'.';
document.getElementById('foot').textContent='Source: '+D.sources.join(', ')+'. Compliance is scored with the same rules as the jurisdiction PDF report: a "No" answer needs remediation unless the surveyor noted it as not applicable; sections a site does not have (parking, drop-off, ramp, lift, elevator, extra routes or entrances) are not counted.';

// drop-down
const pick=document.getElementById('pick');
pick.appendChild(el('option',{value:'overview',text:'All polling places (overview)'}));
const gF=el('optgroup',{label:'Needs remediation ('+(sites.length-nPass)+')'}), gP=el('optgroup',{label:'Compliant ('+nPass+')'});
sites.forEach(s=>{const t=s.name+(s.loc?' — '+s.loc:'')+(s.status==='fail'?'  ('+plural(s.fails,'item')+')':'');
 (s.status==='fail'?gF:gP).appendChild(el('option',{value:s.id,text:t}));});
if(gF.children.length)pick.appendChild(gF); if(gP.children.length)pick.appendChild(gP);
const order=['overview',...[...pick.querySelectorAll('option')].map(o=>o.value).filter(v=>v!=='overview')];
pick.addEventListener('change',()=>go(pick.value));
document.getElementById('prev').addEventListener('click',()=>step(-1));
document.getElementById('next').addEventListener('click',()=>step(1));
function step(d){const i=order.indexOf(pick.value);const j=Math.min(order.length-1,Math.max(0,i+d));go(order[j]);}
document.querySelectorAll('#viewmode button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;
 try{localStorage.setItem('ada-dash-mode',mode);}catch(e){} render(pick.value,true);}));

function go(id){if(location.hash!=='#'+id){location.hash=id;}else render(id);}
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));

function render(id,keepScroll){
 if(!byId[id])id='overview';
 pick.value=id;
 const i=order.indexOf(id);
 document.getElementById('prev').disabled=i<=0; document.getElementById('next').disabled=i>=order.length-1;
 document.querySelectorAll('#viewmode button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
 document.getElementById('viewmode').classList.toggle('hidden',id==='overview');
 const main=document.getElementById('main'); main.replaceChildren(id==='overview'?overview():site(byId[id]));
 if(!keepScroll)window.scrollTo(0,0);
}

function overview(){
 const f=document.createDocumentFragment();
 const items=sites.reduce((a,s)=>a+s.fails,0);
 f.appendChild(el('div',{class:'tiles'},
  tile('Polling places',sites.length,D.dates||''),
  tile('Compliant overall',nPass,pct(nPass)+' of polling places'),
  tile('Need remediation',sites.length-nPass,pct(sites.length-nPass)+' of polling places'),
  tile('Items to remediate',items,'failed answers across all sites')));
 // matrix
 const head=el('tr',null,el('th',{scope:'col',text:'Polling place'}),SEC.map(([k,l])=>el('th',{class:'c',scope:'col',title:l,'aria-label':l,text:k})),el('th',{class:'c',scope:'col',text:'Items'}));
 const body=el('tbody');
 sites.forEach(s=>{
  const tr=el('tr',{tabindex:'0',onclick:()=>go(s.id),onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(s.id);}}},
   el('th',{scope:'row',style:'font-weight:500'},s.name,s.loc?el('span',{class:'loc',text:s.loc}):null),
   s.secs.map(x=>el('td',{class:'c'},el('span',{class:'cell '+x.status,title:x.label+': '+secStatusText(x),text:x.status==='pass'?'✓':x.status==='fail'?String(x.fails):'–'}))),
   el('td',{class:'c'},s.status==='pass'?pill('pass','0'):el('span',{style:'font-weight:600',text:String(s.fails)})));
  body.appendChild(tr);});
 f.appendChild(el('section',{class:'card'},
  el('h2',{text:'Every polling place at a glance'}),
  el('p',{class:'meta',style:'margin:4px 0 14px',text:'Select a row (or use the drop-down above) to open that polling place’s survey details.'}),
  el('div',{class:'tablewrap'},el('table',{class:'matrix'},el('thead',null,head),body)),
  el('p',{class:'keyrow'},
   el('span',null,el('span',{class:'cell pass',text:'✓'}),'Compliant'),
   el('span',null,el('span',{class:'cell fail',text:'2'}),'Number of items needing remediation'),
   el('span',null,el('span',{class:'cell na',text:'–'}),'Not applicable at this site'),
   el('span',null,SEC.map(([k,l])=>k+' '+l).join(' · ')))));
 // most common issues
 const tally={};
 sites.forEach(s=>s.secs.forEach(x=>x.instances.forEach(inst=>inst.items.forEach(it=>{if(it.st!=='fail')return;
  const base=it.code.replace(/^([A-I])[23](\d+)$/,'$1$2'); // C21 -> C1 etc. (second/third route or entrance)
  const k=base; (tally[k]=tally[k]||{code:base,q:it.q,sites:new Set()}).sites.add(s.id);}))));
 const top=Object.values(tally).sort((a,b)=>b.sites.size-a.sites.size||a.code.localeCompare(b.code,undefined,{numeric:true})).slice(0,10);
 if(top.length){const max=top[0].sites.size;
  f.appendChild(el('section',{class:'card'},el('h2',{text:'Most common items needing remediation'}),
   el('p',{class:'meta',style:'margin:4px 0 16px',text:'Number of polling places where each survey question failed (top '+top.length+').'}),
   el('ul',{class:'bars'},top.map(t=>el('li',null,el('span',{class:'code',text:t.code}),el('span',{class:'q',text:t.q}),
    el('span',{class:'code'}),el('div',{class:'track'},el('div',{class:'fill',style:'width:'+(t.sites.size/max*100).toFixed(1)+'%'})),
    el('span',{class:'n',text:t.sites.size+' of '+sites.length}))))));}
 return f;
}
function tile(k,v,s){return el('div',{class:'tile'},el('div',{class:'k',text:k}),el('div',{class:'v',text:String(v)}),el('div',{class:'s',text:s}));}
function pct(n){return sites.length?Math.round(n/sites.length*100)+'%':'–';}

function site(s){
 const f=document.createDocumentFragment();
 // header card
 const facts=[['Location',s.loc],['Address',s.addr],['Township / ward',s.twp],['Polling place type',s.ptype],['Type of premises',s.prem],
  ['Location within building',s.within],['Survey date',s.date],['Surveyor',s.surveyor]].filter(x=>x[1]);
 const links=[];
 s.photos.forEach((u,i)=>links.push(el('a',{href:u,target:'_blank',rel:'noopener',text:s.photos.length>1?'Photo '+(i+1):'Photo'})));
 if(s.pdf)links.push(el('a',{href:s.pdf,target:'_blank',rel:'noopener',text:'Original survey (PDF)'}));
 f.appendChild(el('section',{class:'card'},
  el('div',{class:'sitehead'},el('div',null,el('p',{class:'eyebrow',text:s.noprecinct?'Polling place':'Precinct'}),el('h2',{text:s.name})),
   s.status==='pass'?pill('pass','Compliant overall',true):pill('fail',plural(s.fails,'item')+(s.fails===1?' needs':' need')+' remediation',true)),
  el('dl',{class:'facts'},facts.map(([k,v])=>el('div',null,el('dt',{text:k}),el('dd',{text:v})))),
  links.length?el('div',{class:'links noprint'},links):null,
  el('div',{class:'strip',role:'list'},s.secs.map(x=>el('button',{type:'button',role:'listitem',class:'chip '+x.status,onclick:()=>openSec(x.key)},
   el('span',{class:'t',text:x.key+'. '+x.label}),el('span',{class:'s',text:x.status==='na'?x.na:secStatusText(x)}))))));
 // remediation list
 const fails=s.secs.filter(x=>x.status==='fail');
 const rem=el('section',{class:'card'},el('h2',{text:'Items needing remediation'}));
 if(!fails.length) rem.appendChild(el('p',{class:'empty-state',style:'margin-top:8px',text:'None. Every applicable item at this polling place was found compliant.'}));
 fails.forEach(x=>{const g=el('div',{class:'secgroup'},el('h3',{text:x.key+'. '+x.label}));
  x.instances.forEach(inst=>inst.items.filter(it=>it.st==='fail').forEach(it=>g.appendChild(issue(it,x.instances.length>1?inst.label:''))));
  rem.appendChild(g);});
 rem.firstChild.after(el('p',{class:'meta',style:'margin:4px 0 10px',text:'Each item is a survey question answered “No”, with the surveyor’s notes and measurements.'}));
 f.appendChild(rem);
 if(s.improve) f.appendChild(el('section',{class:'card'},el('h2',{text:'Surveyor’s suggested improvements'}),el('p',{class:'improve',text:s.improve})));
 // full survey
 f.appendChild(el('div',{class:'sitehead',style:'margin:26px 0 10px;align-items:baseline'},
  el('h2',{text:mode==='all'?'Full survey, section by section':'Survey sections with items to remediate'}),
  el('span',{class:'muted noprint',style:'font-size:14px',text:mode==='all'?'Showing every answer and note.':'Switch to “All answers” above to see every answer and note.'})));
 s.secs.forEach(x=>{
  if(mode==='fail'&&x.status!=='fail')return;
  const d=el('details',{class:'sec',id:'sec-'+x.key,open:x.status==='fail'||mode==='all'||null},
   el('summary',null,el('h3',{text:x.key+'. '+x.label}),pill(x.status,x.status==='na'?x.na:secStatusText(x))));
  const b=el('div',{class:'secbody'});
  if(x.status==='na'&&!x.instances.length){b.appendChild(el('p',{class:'empty-state',text:x.na+', so this section was not part of the survey for this site.'}));}
  x.instances.forEach(inst=>{
   const rows=inst.items.filter(it=>mode==='all'||it.st==='fail');
   if(!rows.length&&mode==='fail')return;
   if(inst.label&&x.instances.length>1||inst.desc.length)b.appendChild(el('p',{class:'inst-h',text:inst.label||'Details'}));
   if(inst.desc.length)b.appendChild(el('p',{class:'descs'},inst.desc.map(([k,v],i)=>[i?' · ':'',el('span',{text:k+': '}),v])));
   b.appendChild(el('table',{class:'qtable'},el('thead',null,el('tr',null,el('th',{text:'Item'}),el('th',{text:'Question'}),el('th',{text:'Result'}),el('th',{text:'Notes and measurements'}))),
    el('tbody',null,rows.map(it=>el('tr',{class:it.st},el('td',{class:'code',text:it.code}),el('td',null,it.q,it.why?el('span',{class:'why',text:it.why}):null),
     el('td',{class:'ans'},it.st==='pass'?pill('pass','Yes · compliant'):it.st==='fail'?pill('fail','No · remediate'):pill('skip',it.ans?it.ans+' · not counted':'Not answered')),
     el('td',{class:'nt',text:it.note||'—'}))))));
  });
  if(mode==='all'&&x.stray.length){b.appendChild(el('p',{class:'inst-h',text:'Other notes recorded'}));
   b.appendChild(el('ul',{class:'descs'},x.stray.map(n=>el('li',null,el('b',{text:n.code+': '}),n.note))));}
  d.appendChild(b); f.appendChild(d);});
 return f;
}
function issue(it,inst){return el('div',{class:'issue'},el('span',{class:'code-badge',text:it.code}),
 el('div',null,inst?el('div',{class:'inst',text:inst}):null,el('div',{class:'q',text:it.q}),
  it.note?el('div',{class:'note'},el('b',{text:'Surveyor notes'}),it.note):el('div',{class:'note empty',text:'No comment or measurement recorded.'})));}
function openSec(k){let d=document.getElementById('sec-'+k);
 if(!d&&mode==='fail'){mode='all';render(pick.value,true);d=document.getElementById('sec-'+k);}
 if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'});d.querySelector('summary').focus({preventScroll:true});}}

render(location.hash.slice(1));
})();
</script>
